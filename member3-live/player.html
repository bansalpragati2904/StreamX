

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamX Video Player</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d12;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #111318;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30343d;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: #eaff42;
        }

        .back {
            color: white;
            background: #2a2e38;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        .back:hover {
            background: #eaff42;
            color: black;
        }

        .player-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* LIVE TIMER */

        .live-timer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .live-label {
            background: #ff253a;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
        }

        #liveTimer {
            color: white;
            font-size: 20px;
            font-variant-numeric: tabular-nums;
        }

        /* VIDEO PLAYER */

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* VIDEO DETAILS */

        .video-details {
            background: #191d25;
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
        }

        .video-details h1 {
            font-size: 25px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .video-details p {
            color: #b7bac3;
            margin-bottom: 20px;
        }

        .youtube-btn {
            display: inline-block;
            padding: 13px 22px;
            background: #eaff42;
            color: black;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
        }

        .youtube-btn:hover {
            background: #d7e600;
        }

        .note {
            margin-top: 20px;
            color: #aeb3be;
            line-height: 1.6;
        }

        @media (max-width: 650px) {
            header {
                padding: 15px 5%;
            }

            .video-details h1 {
                font-size: 19px;
            }

            .logo {
                font-size: 22px;
            }

            .live-timer {
                font-size: 15px;
            }

            #liveTimer {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <a href="live.html" class="logo">
            STREAM<span>X</span>
        </a>

        <a href="live.html" class="back">
            ← Back
        </a>
    </header>


    <main class="player-container">

        <!-- LIVE TIMER -->

        <div class="live-timer">
            <span class="live-label">● LIVE</span>
            <span id="liveTimer">00:00:00</span>
        </div>


        <!-- VIDEO PLAYER -->

        <div class="video-wrapper" id="videoWrapper">

            <iframe
                id="videoPlayer"
                title="StreamX Video Player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>


        <!-- VIDEO DETAILS -->

        <div class="video-details">

            <h1 id="videoTitle">Video Title</h1>

            <p id="videoCreator">Creator Name</p>

            <a
                href="#"
                id="youtubeLink"
                class="youtube-btn"
                target="_blank"
                rel="noopener noreferrer">
                ▶ Watch on YouTube
            </a>

            <p class="note">
                Some YouTube videos do not allow playback
                on other websites. If the player does not work,
                use the Watch on YouTube button.
            </p>

        </div>

    </main>


    <script>

        // GET URL PARAMETERS

        const params = new URLSearchParams(window.location.search);

        const title = params.get("title") || "Video";
        const creator = params.get("creator") || "Creator";
        const videoUrl = params.get("video") || "";

        document.getElementById("videoTitle").textContent = title;
        document.getElementById("videoCreator").textContent = creator;


        // GET YOUTUBE VIDEO ID

        function getYouTubeId(url) {

            try {

                const parsed = new URL(url);

                const hostname = parsed.hostname
                    .replace(/^www\./, "")
                    .replace(/^m\./, "");

                if (hostname === "youtu.be") {
                    return parsed.pathname.split("/")[1];
                }

                if (
                    hostname === "youtube.com" ||
                    hostname === "youtube-nocookie.com"
                ) {

                    if (parsed.pathname === "/watch") {
                        return parsed.searchParams.get("v");
                    }

                    if (parsed.pathname.startsWith("/live/")) {
                        return parsed.pathname.split("/")[2];
                    }

                    if (parsed.pathname.startsWith("/embed/")) {
                        return parsed.pathname.split("/")[2];
                    }

                }

            } catch (error) {
                console.error("Invalid URL:", error);
            }

            return "";
        }


        // SET VIDEO

        const videoId = getYouTubeId(videoUrl);

        const iframe = document.getElementById("videoPlayer");
        const youtubeLink = document.getElementById("youtubeLink");
        const wrapper = document.getElementById("videoWrapper");

        if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {

            iframe.src =
                "https://www.youtube.com/embed/" + videoId;

            youtubeLink.href =
                "https://www.youtube.com/watch?v=" + videoId;

        } else {

            iframe.remove();

            wrapper.textContent = "Video unavailable.";

            youtubeLink.style.display = "none";

        }


        // LIVE TIMER

        let seconds = 0;

        function updateLiveTimer() {

            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            const time =
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(secs).padStart(2, "0");

            document.getElementById("liveTimer").textContent = time;

            seconds++;
        }

        updateLiveTimer();

        setInterval(updateLiveTimer, 1000);

    </script>

</body>
</html>

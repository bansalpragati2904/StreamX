
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamX - History</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <h1>STREAMX</h1>

        <div class="nav-links">
            <a href="profile.html">Profile</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="history.html">History</a>
            <a href="settings.html">Settings</a>
            <a href="login.html">Logout</a>
        </div>
    </nav>

    <!-- HISTORY -->
    <div class="container history-page">

        <h2>Watch History</h2>

        <p class="description">
            Movies and shows you watched recently.
        </p>

        <p id="historyMessage"></p>

        <!-- YOUTUBE TRAILER PLAYER -->
        <h3 id="trailerTitle"
            style="display:none; color:#ffe500; margin:20px;">
            Movie Trailer
        </h3>

        <iframe
            id="trailerPlayer"
            width="100%"
            height="400"
            style="display:none; max-width:700px; border:0; border-radius:10px;"
            src=""
            title="YouTube movie trailer"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

        <div class="history">

            <!-- AVENGERS -->
            <div class="history-item">

                <img
                    class="history-image"
                    src="https://images.wallpapersden.com/image/download/avengers-endgame-2019-movie_64330_1940x2320.jpg"
                    alt="Avengers">

                <div>
                    <h3>Avengers</h3>

                    <p>Watched 80%</p>

                    <div class="progress">
                        <div class="progress-bar progress-80"></div>
                    </div>

                    <button onclick="continueMovie('Avengers')">
                        Continue
                    </button>
                </div>

            </div>

            <!-- INTERSTELLAR -->
            <div class="history-item">

                <img
                    class="history-image"
                    src="https://s3.amazonaws.com/nightjarprod/content/uploads/sites/130/2021/08/19085635/gEU2QniE6E77NI6lCU6MxlNBvIx-scaled.jpg"
                    alt="Interstellar">

                <div>
                    <h3>Interstellar</h3>

                    <p>Watched 100%</p>

                    <div class="progress">
                        <div class="progress-bar progress-100"></div>
                    </div>

                    <button onclick="continueMovie('Interstellar')">
                        Watch Again
                    </button>
                </div>

            </div>

            <!-- THE DARK KNIGHT -->
            <div class="history-item">

                <img
                    class="history-image"
                    src="https://media.themoviedb.org/t/p/w440_and_h660_face/xQPgyZOBhaz1GdCQIPf5A5VeFzO.jpg"
                    alt="The Dark Knight">

                <div>
                    <h3>The Dark Knight</h3>

                    <p>Watched 35%</p>

                    <div class="progress">
                        <div class="progress-bar progress-35"></div>
                    </div>

                    <button onclick="continueMovie('The Dark Knight')">
                        Continue
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>

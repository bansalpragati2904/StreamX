<!DOCTYPE html>

<html>

<head>
<title>StreamX - Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="top">

    <h1>STREAMX</h1>

</div>


<!-- Login -->

<div class="login-box">

    <h2>Sign In</h2>


    <input
        type="text"
        id="email"
        placeholder="Email"
    >

    <p id="emailError" class="error-message"></p>


    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <p id="passwordError" class="error-message"></p>


    <button onclick="login()">
        Sign In
    </button>


    <p>
        New to StreamX?

        <a href="#" onclick="showSignup()">
            Sign up now
        </a>

    </p>

</div>


<!-- Signup -->

<div class="login-box signup-box" id="signupBox">

    <h2>Create Account</h2>


    <input
        type="text"
        id="name"
        placeholder="Your Name"
    >


    <input
        type="text"
        id="signupEmail"
        placeholder="Email"
    >


    <input
        type="password"
        id="signupPassword"
        placeholder="Password"
    >


    <button onclick="signup()">
        Sign Up
    </button>

</div>
<script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamX - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP LOGO -->

    <div class="top">

        <h1>STREAMX</h1>

    </div>


    <!-- LOGIN / SIGNUP BOX -->

    <div class="login-box">


        <!-- LOGIN FORM -->

        <div id="loginForm">

            <h2>Sign In</h2>


            <input
                type="text"
                id="email"
                placeholder="Email"
            >

            <p id="emailError" class="error-message"></p>


            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <p id="passwordError" class="error-message"></p>


            <p id="pageMessage" class="error-message"></p>


            <button onclick="login()">
                Sign In
            </button>


            <p>
                New to StreamX?

                <a href="#" onclick="showSignup(); return false;">
                    Sign up now
                </a>
            </p>

        </div>


        <!-- SIGNUP FORM -->

        <div id="signupForm">

            <h2>Create Account</h2>


            <!-- NAME -->

            <input
                type="text"
                id="name"
                placeholder="Your Name"
            >


            <!-- AGE -->

            <input
                type="number"
                id="age"
                placeholder="Your Age"
                min="1"
                max="100"
            >


            <!-- EMAIL -->

            <input
                type="text"
                id="signupEmail"
                placeholder="Email"
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
            >


            <p id="signupMessage" class="error-message"></p>


            <button onclick="signup()">
                Sign Up
            </button>


            <p>
                Already have an account?

                <a href="#" onclick="showLogin(); return false;">
                    Sign in
                </a>
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>

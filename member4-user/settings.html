<!DOCTYPE html>

<html>

<head>
<title>StreamX - Settings</title>

<link rel="stylesheet" href="style.css">


</head>

<body>
<!-- Navigation -->

<nav>

    <h1>STREAMX</h1>


    <div class="nav-links">

    <a href="../member1-home/home.html">Home</a>

    <a href="watchlist.html">Watchlist</a>

    <a href="history.html">History</a>

    <a href="settings.html">Settings</a>

    <a href="profile.html">Profile</a>

    <a href="login.html" id="logoutLink" class="logout-link">Logout</a>

</div>

</nav>


<!-- Settings -->

<div class="container settings-page">

    <h2>⚙️ Settings</h2>

    <p class="description">
        Manage your StreamX account and preferences.
    </p>


    <div class="settings-box">


        <!-- Account Settings -->

        <div class="setting-section">

            <h3>👤 Account Settings</h3>

            <p>Manage your account information.</p>

            <button onclick="changeEmail()">
                Change Email
            </button>

            <button onclick="changePassword()">
                Change Password
            </button>

        </div>


        <!-- Playback Settings -->

        <div class="setting-section">

            <h3>▶️ Playback Settings</h3>


            <label>

                <input
                    type="checkbox"
                    id="autoplay"
                >

                Autoplay next episode

            </label>


            <br><br>


            <label>

                Video Quality:

                <select id="quality">

                    <option>Auto</option>

                    <option>1080p</option>

                    <option>720p</option>

                    <option>480p</option>

                </select>

            </label>

        </div>


        <!-- Notifications -->

        <div class="setting-section">

            <h3>🔔 Notifications</h3>

            <p>Choose whether you want notifications.</p>


            <label>

                <input
                    type="checkbox"
                    id="notification"
                >

                Receive notifications

            </label>

        </div>


        <!-- Buttons -->

        <div class="settings-buttons">

            <button onclick="saveSettings()">
                💾 Save Settings
            </button>

            <button onclick="logout()">
                🚪 Logout
            </button>

        </div>


    </div>

</div>


<script src="script.js"></script>

</body>

</html>

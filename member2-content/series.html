<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamX | Series</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <div class="logo-box">S</div>
            <div class="logo-text">stream<span>x</span></div>
        </div>

        <div class="nav-right">

            <nav class="nav-links">

                <!-- MEMBER 1 HOME -->
                <a href="../member1-home/home.html"
                   class="working-link">
                    Home
                </a>

                <!-- MEMBER 2 MOVIES -->
                <a href="movies.html"
                   class="working-link">
                    Movies
                </a>

                <!-- MEMBER 2 SERIES -->
                <a href="series.html"
                   class="working-link active">
                    Series
                </a>

                <!-- MEMBER 3 LIVE -->
                <a href="../member3-live/live.html"
                   class="working-link">
                    Live
                </a>

            </nav>

            <div class="nav-actions">

                <button
                    class="icon-btn search-btn"
                    aria-label="Search">

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <circle
                            cx="11"
                            cy="11"
                            r="8">
                        </circle>

                        <line
                            x1="21"
                            y1="21"
                            x2="16.65"
                            y2="16.65">
                        </line>

                    </svg>

                </button>

                <!-- MEMBER 4 PROFILE -->
                <a
                    href="../member4-user/profile.html"
                    class="profile-btn">
                    Profile
                </a>

            </div>

        </div>

    </header>


    <!-- SERIES PAGE -->
    <main class="page">

        <h1 class="page-title">
            TV Series
        </h1>

        <p class="page-subtitle">
            Discover popular series and web shows.
        </p>


        <!-- FILTERS -->
        <div class="filters">

            <button
                class="filter-btn active"
                data-type="series"
                data-genre="All">
                All
            </button>

            <button
                class="filter-btn"
                data-type="series"
                data-genre="Mystery">
                Mystery
            </button>

            <button
                class="filter-btn"
                data-type="series"
                data-genre="Crime">
                Crime
            </button>

            <button
                class="filter-btn"
                data-type="series"
                data-genre="Drama">
                Drama
            </button>

            <button
                class="filter-btn"
                data-type="series"
                data-genre="Fantasy">
                Fantasy
            </button>

            <button
                class="filter-btn"
                data-type="series"
                data-genre="Sci-Fi">
                Sci-Fi
            </button>

        </div>


        <!-- SERIES CARDS -->
        <div
            id="seriesGrid"
            class="series-grid">
        </div>

    </main>


    <!-- VIDEO MODAL -->
    <div
        id="videoModal"
        class="modal">

        <div class="modal-box">

            <button
                id="closeModal"
                class="close-btn">
                ×
            </button>

            <iframe
                id="videoPlayer"
                src=""
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
